name: Deploy SPND detector to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/vendor
          cp index.html site/index.html
          cat data/trajectory-*.b64 | base64 --decode | gzip --decompress > site/spnd_trajectories.jsonl
          curl -fsSL --retry 3 https://unpkg.com/three@0.160.0/build/three.module.js -o site/vendor/three.module.js
          curl -fsSL --retry 3 https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js -o site/vendor/OrbitControls.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
